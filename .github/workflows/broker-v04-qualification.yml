name: Broker v0.4 isolated qualification checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  postgres-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run candidate SQL against disposable PostgreSQL and concurrent clients
        env:
          SAC_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 ci/broker-v04-postgres/check.py
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise triage image and Docker restrictions
        run: bash ci/broker-v04-postgres/container-smoke.sh
  rootless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise wrapper on an ephemeral rootless daemon
        run: bash ci/broker-v04-postgres/rootless-smoke.sh
