name: Broker v0.4 isolated qualification checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  postgres-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run candidate SQL against disposable PostgreSQL and concurrent clients
        env:
          SAC_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 ci/broker-v04-postgres/check.py
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise triage image and Docker restrictions
        run: bash ci/broker-v04-postgres/container-smoke.sh
  rootless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare rootless prerequisites on the disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq uidmap rootlesskit slirp4netns
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null
          fi
          if ! grep -q "^$(id -un):" /etc/subuid; then sudo usermod --add-subuids 100000-165535 "$(id -un)"; fi
          if ! grep -q "^$(id -un):" /etc/subgid; then sudo usermod --add-subgids 100000-165535 "$(id -un)"; fi
      - name: Set up rootless Docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          rootless: true
          set-host: true
          version: v28.3.3
      - name: Exercise wrapper on an ephemeral rootless daemon
        run: bash ci/broker-v04-postgres/rootless-smoke.sh
